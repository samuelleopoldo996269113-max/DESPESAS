<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despesa</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10243b">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Despesa">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1 id="appTitle">Despesa</h1>
    <div class="topo-botoes">
      <button id="scanButton" aria-label="Ler nota com a câmera">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button id="addButton" aria-label="Adicionar">+</button>
      <button id="menuButton" class="menu-dots" aria-label="Configurações">&#8942;</button>
    </div>
  </header>

  <nav class="mes">
    <button id="prevMonth">&#8249;</button>
    <strong id="monthLabel"></strong>
    <button id="nextMonth">&#8250;</button>
  </nav>

  <section class="charts" id="charts">
    <button type="button" id="chartsToggle" class="charts-toggle" aria-expanded="false">
      <span id="chartsToggleText">Gráficos</span><span id="chartsArrow">&#9662;</span>
    </button>
    <div id="chartsBody" hidden>
      <div class="choice-row charts-tabs">
        <button type="button" class="choice active" id="tabMonth">Mês</button>
        <button type="button" class="choice" id="tab6">6 meses</button>
      </div>
      <div id="chartMonth"></div>
      <div id="chart6" hidden>
        <div class="chart-range">
          <button type="button" id="rangePrev" aria-label="Mês anterior">&#8249;</button>
          <span id="rangeLabel"></span>
          <button type="button" id="rangeNext" aria-label="Próximo mês">&#8250;</button>
        </div>
        <div id="chart6Svg"></div>
      </div>
    </div>
  </section>

  <div id="overdueAlert" class="alerta" hidden></div>

  <main>
    <div id="transactions"></div>
  </main>

  <footer class="resumo">
    <div>
      <span id="lblTotal">Total a pagar</span>
      <strong id="totalExpenses">R$ 0,00</strong>
    </div>
    <div>
      <span id="lblRemaining">Saldo a pagar</span>
      <strong id="remaining">R$ 0,00</strong>
    </div>
    <div class="wallet">
      <span id="lblWallet">Carteira</span>
      <strong id="wallet">R$ 0,00</strong>
    </div>
    <div class="wallet cardbox">
      <span id="lblCard">Cartão de crédito</span>
      <strong id="cardTotal">R$ 0,00</strong>
    </div>
  </footer>

  <div id="txOverlay" class="overlay" hidden>
    <form id="txForm" class="formulario">
      <h2 id="formTitle">Nova movimentação</h2>

      <label id="lblType">Tipo de movimentação</label>
      <div class="type-buttons">
        <button type="button" id="expenseButton" class="type-choice expense-choice">DESPESA</button>
        <button type="button" id="incomeButton" class="type-choice income-choice">ENTRADA</button>
        <button type="button" id="cardButton" class="type-choice card-choice">CARTÃO</button>
      </div>
      <p id="typeError" class="type-error" hidden></p>

      <label id="lblDescription">Descrição</label>
      <input id="description" required>

      <label id="lblAmount">Valor</label>
      <input id="amount" type="text" inputmode="numeric" autocomplete="off" required placeholder="0,00" value="0,00">

      <label id="lblDate">Data</label>
      <input id="dueDate" type="date" required>

      <div id="categoryField">
        <label id="lblCategory">Categoria (opcional)</label>
        <select id="category"></select>
      </div>

      <label id="lblRepeat">Repetição</label>
      <select id="repeat">
        <option value="none"></option>
        <option value="monthly"></option>
        <option value="installments"></option>
      </select>

      <div id="countField" hidden>
        <label id="lblCount">Quantidade de parcelas</label>
        <input id="count" type="number" inputmode="numeric" min="2" placeholder="0">
      </div>

      <button type="submit" id="saveButton">Salvar</button>
      <button type="button" id="cancelButton">Cancelar</button>
    </form>
  </div>

  <div id="settingsOverlay" class="action-overlay" hidden>
    <div class="action-menu settings-menu">
      <button type="button" id="closeSettings" class="close-x" aria-label="Fechar">&#10005;</button>
      <h2 id="settingsTitle">Configurações</h2>

      <label id="lblLanguage">Idioma</label>
      <select id="languageSelect">
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>

      <label id="lblMode">Modo</label>
      <div class="choice-row">
        <button type="button" class="choice" data-mode="light" id="modeLight">Claro</button>
        <button type="button" class="choice" data-mode="dark" id="modeDark">Escuro</button>
      </div>

      <label id="lblColor">Cor do aplicativo</label>
      <div class="choice-row">
        <button type="button" class="choice" data-color="blue" id="colorBlue">Azul</button>
        <button type="button" class="choice" data-color="pink" id="colorPink">Rosa</button>
      </div>

      <label id="lblCardSet">Cartão de crédito</label>
      <input type="number" id="cardDayInput" inputmode="numeric" min="1" max="31" placeholder="">
      <div class="choice-row" style="margin-top:8px">
        <button type="button" class="choice" id="cardNextBtn">Mês seguinte</button>
        <button type="button" class="choice" id="cardSameBtn">Mesmo mês</button>
      </div>
      <p id="cardSetInfo" class="backup-info"></p>

      <label id="lblBackup">Backup</label>
      <button type="button" id="exportButton">Exportar backup</button>
      <button type="button" id="importButton">Importar backup</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <p id="backupInfo" class="backup-info"></p>
    </div>
  </div>

  <input type="file" id="scanFile" accept="image/*" capture="environment" hidden>

  <div id="scanOverlay" class="scan-overlay" hidden>
    <div class="action-menu">
      <h2 id="scanTitle">Lendo a nota</h2>
      <p id="scanStatus"></p>
    </div>
  </div>

  <script src="script.js"></script>
  <!-- PWA: registra o service worker (permite instalar e abrir sem internet) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
